name = "zine-web"
main = "src/public-worker.ts"
compatibility_date = "2026-04-14"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[env.production]
name = "zine-web-production"
workers_dev = false
routes = [
  { pattern = "www.myzine.app", custom_domain = true },
  { pattern = "myzine.app", custom_domain = true }
]

[vars]
UPSTREAM_API_URL = "http://localhost:8787"

[[services]]
binding = "API"
service = "zine-worker"

[env.production.vars]
UPSTREAM_API_URL = "https://api.myzine.app"

[[env.production.services]]
binding = "API"
service = "zine-worker-production"
