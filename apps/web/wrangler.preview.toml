name = "zine-web-preview"
main = "src/preview-worker.ts"
compatibility_date = "2026-08-06"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[services]]
binding = "API"
service = "zine-worker-production"

[vars]
UPSTREAM_API_URL = "https://api.myzine.app"
PREVIEW_ID = "local-preview"
PREVIEW_GIT_SHA = "local"

# Existing preview backend is production: fail closed for mutations.
PREVIEW_READ_ONLY = "true"
APPLE_APPLICATION_IDENTIFIER = "TRA7965NM5.app.zine.native"
