name: API private backup

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zine-api-next-production-control
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run scripts/install-ci-sqlite.ts
        working-directory: apps/api
      - run: bun run scripts/backup.ts production
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        with:
          name: sanitized-backup-receipt
          path: apps/api/evidence/backup-latest.json
          if-no-files-found: error
      - name: Remove ephemeral private backups
        if: always()
        run: rm -rf apps/api/.local-data/backups
