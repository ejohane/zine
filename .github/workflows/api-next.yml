name: API rewrite checks

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'bun.lock'
      - '.github/workflows/api-next.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'bun.lock'
      - '.github/workflows/api-next.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run lint
        working-directory: apps/api
      - run: bun run typecheck
        working-directory: apps/api
      - run: bun run test
        working-directory: apps/api
      - run: bun run build
        working-directory: apps/api
