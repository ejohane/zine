name: API service monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zine-api-next-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZINE_API_NEXT_OPS_TOKEN: ${{ secrets.ZINE_API_NEXT_OPS_TOKEN }}
      ZINE_API_NEXT_OPS_TOKEN_EXPIRES_AT: ${{ vars.ZINE_API_NEXT_OPS_TOKEN_EXPIRES_AT }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun run scripts/monitor.ts
        working-directory: apps/api
