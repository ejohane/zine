name: API release

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'bun.lock'
      - '.github/workflows/api-next-release.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Release to staging, or stage and promote the same source to production
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Serialize migrations, exports and promotions with the backup workflow.
concurrency:
  group: zine-api-next-production-control
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run typecheck && bun run test && bun run build
        working-directory: apps/api

  staging:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release.ts staging
        working-directory: apps/api

  production:
    needs: staging
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bun run scripts/install-ci-sqlite.ts
        working-directory: apps/api
      - run: bun run scripts/release.ts production
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        with:
          name: sanitized-predeployment-backup-receipt
          path: apps/api/evidence/backup-latest.json
          if-no-files-found: error
      - name: Remove ephemeral private backups
        if: always()
        run: rm -rf apps/api/.local-data/backups
