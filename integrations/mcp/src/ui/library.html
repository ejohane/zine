<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zine saved library</title>
    <style>
      /* THEME_TOKENS */
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--primaryText);
        background: var(--canvas);
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        padding: 24px;
        max-width: 900px;
        margin: auto;
      }
      [hidden] {
        display: none !important;
      }
      h2,
      h3,
      p {
        margin: 0;
      }
      :focus-visible {
        outline: 2px solid var(--brandAccent);
        outline-offset: 3px;
      }
      ::selection {
        background: var(--brandAccent);
        color: var(--onAccent);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      #error {
        margin-bottom: 16px;
        line-height: 1.5;
      }
      #cards {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: min(244px, 82vw);
        gap: 16px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
        padding: 5px 4px 12px;
        margin: -5px -4px 0;
        list-style: none;
      }
      .card {
        scroll-snap-align: start;
      }
      .card-link {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        color: inherit;
        text-decoration: none;
        border-radius: 14px;
      }
      svg {
        width: 17px;
        height: 17px;
        flex: none;
      }
      .card {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cover {
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: var(--raised);
        color: var(--secondaryText);
      }
      .cover:hover {
        background: var(--raised);
      }
      .cover > svg {
        width: 28px;
        height: 28px;
      }
      .artwork {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card[data-type='PODCAST'] .artwork {
        object-fit: contain;
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .card-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        padding: 0;
        border: 0;
        border-radius: 2px;
        min-height: 0;
        background: transparent;
        text-align: left;
        font-size: 0.9375rem;
        line-height: 1.4;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .card-link:hover .card-title {
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .card h3 {
        font: inherit;
        min-height: 2.625rem;
      }
      .meta {
        color: var(--secondaryText);
        font-size: 0.75rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .card .meta {
        display: flex;
        gap: 4px;
        align-items: baseline;
      }
      .creator {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .consumption {
        flex: none;
        white-space: nowrap;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tag {
        padding: 2px 5px;
        background: var(--raised);
        border-radius: 4px;
        font-size: 0.6875rem;
        overflow-wrap: anywhere;
        max-width: 100%;
      }

      .empty {
        padding: 40px 0;
        max-width: 44ch;
        line-height: 1.6;
      }
      .empty p {
        color: var(--secondaryText);
        margin-top: 8px;
      }
      @media (max-width: 520px) {
        main {
          padding: 16px;
        }
        .cover,
        .card-link {
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Zine saved library">
      <p id="status" class="sr-only" role="status" aria-live="polite">Connecting to Zine…</p>
      <p id="error" role="alert" hidden></p>
      <ul id="cards" aria-label="Saved items, horizontally scrollable" tabindex="0"></ul>
      <div class="empty" id="empty" hidden>
        <h2>No saved items found</h2>
        <p>Ask ChatGPT to try a different search or show more of your library.</p>
      </div>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const artworkOrigins = /* ARTWORK_ORIGINS */ [];
      const state = { items: [], query: '', ready: false };
      let rpcId = 0;
      const pending = new Map();
      const notify = (method, params) =>
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      function request(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('TIMEOUT'));
          }, 45000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      function messageFor(result) {
        if (result?._meta?.['mcp/www_authenticate'])
          return 'Link Zine with the required permission, then try again.';
        const code = result?.content?.find((part) => part.type === 'text')?.text;
        if (code === 'NOT_FOUND')
          return 'This saved item or collection is no longer available. Search again to refresh.';
        if (code === 'CONTENT_UNAVAILABLE')
          return 'Saved text is unavailable. You can open the original instead.';
        return 'Zine could not complete that action. Please try again.';
      }
      function showError(error) {
        $('error').textContent =
          error?.message === 'TIMEOUT'
            ? 'Zine took too long to respond. Please try again.'
            : error?.message || 'Zine could not connect. Please try again.';
        $('error').hidden = false;
      }
      function node(tag, text, className) {
        const element = document.createElement(tag);
        if (text != null) element.textContent = text;
        if (className) element.className = className;
        return element;
      }
      function safeUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' &&
            !url.username &&
            !url.password &&
            !url.port &&
            url.hostname.includes('.') &&
            !/^[\d.]+$/.test(url.hostname) &&
            !/[[\]:]/.test(url.hostname) &&
            !/\.(localhost|local|internal|test|invalid)$/.test(url.hostname) &&
            !/(?:token|secret|signature|password|auth|key|credential|email|subscriber|jwt)/i.test(
              url.search
            )
            ? url
            : null;
        } catch {
          return null;
        }
      }
      function icon(kind) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '1.6');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const paths = {
          ARTICLE: ['M6 3h9l4 4v14H5V3h1', 'M14 3v5h5', 'M8 12h8M8 16h6'],
          VIDEO: ['M4 5h16v14H4z', 'm10 9 5 3-5 3z'],
          PODCAST: ['M5 13v-2a7 7 0 0 1 14 0v2', 'M5 12H3v6h4v-6zM19 12h2v6h-4v-6z'],
          POST: ['M5 4h14v12H9l-4 4z', 'M8 8h8M8 12h5'],
        };
        for (const d of paths[kind] || paths.ARTICLE) {
          const path = document.createElementNS(svg.namespaceURI, 'path');
          path.setAttribute('d', d);
          svg.append(path);
        }
        return svg;
      }
      function consumption(item) {
        if (item.readingTimeMinutes > 0) return `${item.readingTimeMinutes} min read`;
        if (!(item.duration > 0)) return '';
        const minutes = Math.max(1, Math.floor(item.duration / 60));
        return minutes < 60
          ? `${minutes} min`
          : `${Math.floor(minutes / 60)} hr ${minutes % 60} min`;
      }
      $('cards').onkeydown = (event) => {
        if (event.target !== $('cards')) return;
        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
          event.preventDefault();
          $('cards').scrollBy({
            left: event.key === 'ArrowRight' ? 260 : -260,
            behavior: 'instant',
          });
        }
      };
      function render() {
        const scrollPosition = $('cards').scrollLeft;
        $('cards').replaceChildren();
        for (const item of state.items) {
          const card = node('li', null, 'card');
          card.dataset.id = item.bookmarkId;
          card.dataset.type = item.contentType || 'ARTICLE';
          const url = safeUrl(item.url);
          const link = node(url ? 'a' : 'div', null, 'card-link');
          if (url) {
            link.href = url.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.setAttribute('aria-label', `Open original: ${item.title}`);
          }
          const cover = node('div', null, 'cover');
          cover.append(icon(item.contentType));
          const candidates = [item.thumbnailUrl, item.creatorImageUrl]
            .map(safeUrl)
            .filter((url) => url && artworkOrigins.includes(url.origin));
          function loadArtwork() {
            const artwork = candidates.shift();
            if (!artwork) {
              resize();
              return;
            }
            const image = node('img', null, 'artwork');
            image.alt = '';
            image.loading = 'lazy';
            image.referrerPolicy = 'no-referrer';
            image.addEventListener('load', resize);
            image.addEventListener('error', () => {
              image.remove();
              loadArtwork();
            });
            image.src = artwork.href;
            cover.append(image);
          }
          loadArtwork();
          link.append(cover);
          const body = node('div', null, 'card-body');
          const heading = node('h3');
          const title = node('span', item.title, 'card-title');
          heading.append(title);
          body.append(heading);
          const metadata = node('p', null, 'meta');
          metadata.append(
            node(
              'span',
              item.creator || url?.hostname.replace(/^www\./, '') || item.provider,
              'creator'
            )
          );
          const label = consumption(item);
          if (label) metadata.append(node('span', `· ${label}`, 'consumption'));
          body.append(metadata);
          if (item.tags?.length) {
            const tags = node('div', null, 'tags');
            for (const tag of item.tags.slice(0, 2)) tags.append(node('span', tag, 'tag'));
            body.append(tags);
          }
          link.append(body);
          card.append(link);
          $('cards').append(card);
        }
        $('cards').scrollLeft = scrollPosition;
        $('empty').hidden = state.items.length > 0;
        $('status').textContent =
          `${state.items.length} saved ${state.items.length === 1 ? 'item' : 'items'}${state.query ? ` matching “${state.query}”` : ''}`;
        resize();
      }
      function resize() {
        if (state.ready)
          notify('ui/notifications/size-changed', {
            height: Math.ceil(document.documentElement.getBoundingClientRect().height),
          });
      }
      function theme(context) {
        if (context?.theme === 'dark' || context?.theme === 'light')
          document.documentElement.dataset.theme = context.theme;
      }
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
        const message = event.data;
        if (message.id != null && pending.has(message.id)) {
          const p = pending.get(message.id);
          clearTimeout(p.timer);
          pending.delete(message.id);
          if (message.error)
            p.reject(new Error('Zine could not complete that action. Please try again.'));
          else p.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/host-context-changed') theme(message.params);
        if (message.method === 'ui/notifications/tool-result') {
          if (message.params?.isError) {
            showError(new Error(messageFor(message.params)));
            return;
          }
          const data = message.params?.structuredContent?.data;
          if (Array.isArray(data?.items)) {
            state.items = data.items;
            state.query = data.query ?? '';
            $('error').hidden = true;
            render();
          }
        }
        if (message.method === 'ui/notifications/tool-cancelled') {
          render();
          showError(new Error('Search cancelled. You can try again.'));
        }
        if (message.method === 'ui/resource-teardown' && message.id != null) {
          for (const p of pending.values()) {
            clearTimeout(p.timer);
            p.reject(new Error('Component closed.'));
          }
          pending.clear();
          window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');
        }
      });
      try {
        const initialized = await request('ui/initialize', {
          appInfo: { name: 'zine-saved-library', version: '0.1.0' },
          appCapabilities: {},
          protocolVersion: '2026-01-26',
        });
        theme(initialized?.hostContext);
        state.ready = true;
        notify('ui/notifications/initialized', {});
        $('status').textContent = state.items.length
          ? `${state.items.length} saved items`
          : 'Waiting for saved items.';
        new ResizeObserver(resize).observe(document.body);
        resize();
      } catch {
        showError(
          new Error('Could not connect to ChatGPT. Reopen the Zine component to try again.')
        );
        $('status').textContent = 'Connection unavailable';
      }
    </script>
  </body>
</html>
