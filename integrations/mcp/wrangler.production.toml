# Unapplied production target. Deploy only after explicit activation approval.
# The Clerk key is entered by the user in Cloudflare, never checked in here.
name = "zine-mcp-production"
main = "src/server.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false
routes = [{ pattern = "mcp.myzine.app", custom_domain = true }]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = false

[vars]
ENVIRONMENT = "production"
MCP_AUTH_MODE = "clerk-opaque"
MCP_RESOURCE = "https://mcp.myzine.app/mcp"
MCP_OAUTH_ISSUER = "https://clerk.myzine.app"
MCP_OAUTH_JWKS_URL = "https://clerk.myzine.app/.well-known/jwks.json"
MCP_CLERK_CLIENT_IDS = '["5gNCO8oX8tGw0eA5"]'
# Accept instance-verified OAuth clients after Clerk consent, including DCR clients.
# Remove this setting (or use "allowlist") to restore manual client admission.
MCP_CLERK_CLIENT_POLICY = "instance"

[[d1_databases]]
binding = "DB"
database_name = "zine-db-production"
database_id = "82911dea-5a6b-411b-ab4b-4145cb0c191d"

[[r2_buckets]]
binding = "ARTICLE_CONTENT"
bucket_name = "zine-article-content-prod"

# Confirm this namespace is unused before activation. No shared counters.
[[ratelimits]]
name = "MCP_VERIFICATION_LIMITER"
namespace_id = "260101"
simple = { limit = 60, period = 60 }
